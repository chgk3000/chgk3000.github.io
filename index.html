<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЧГК Бот — Игра онлайн</title>
    <style>
        :root {
            --tg-bg: #0e1621;
            --tg-chat-bg: #17212b;
            --tg-msg-in: #182533;
            --tg-msg-out: #2b5278;
            --tg-text: #f5f5f5;
            --tg-text-muted: #708499;
            --tg-link: #52a2ff;
            --tg-button-bg: #202b36;
            --tg-button-text: #2f8cc5;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-bg);
            color: var(--tg-text);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        .chat-container {
            width: 100%;
            max-width: 540px;
            height: 100vh;
            background-color: var(--tg-chat-bg);
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .chat-header {
            background-color: var(--tg-msg-in);
            padding: 10px 15px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgba(0, 0, 0, 0.2);
            z-index: 10;
        }

        .avatar-header {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 12px;
            background: linear-gradient(135deg, #1f2d3d, #0e1621);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            font-weight: bold;
            color: var(--tg-text-muted);
        }

        .bot-info h3 {
            margin: 0;
            font-size: 15px;
            font-weight: 600;
        }

        .bot-info span {
            font-size: 13px;
            color: var(--tg-text-muted);
        }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .message-row {
            display: flex;
            align-items: flex-start;
            max-width: 85%;
            animation: fadeIn 0.3s ease;
        }

        .message-row.out {
            align-self: flex-end;
            max-width: 70%;
        }

        .bot-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            margin-right: 8px;
            flex-shrink: 0;
            background-color: #2b5278;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            font-weight: bold;
            color: #fff;
        }

        .message-box {
            background-color: var(--tg-msg-in);
            padding: 10px 14px;
            border-radius: 12px;
            position: relative;
            font-size: 14.5px;
            line-height: 1.45;
            word-wrap: break-word;
        }

        .message-row.out .message-box {
            background-color: var(--tg-msg-out);
        }

        .message-text {
            white-space: pre-line;
        }

        .message-meta {
            float: right;
            font-size: 11px;
            color: var(--tg-text-muted);
            margin-top: 6px;
            margin-left: 10px;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .message-meta.out-meta {
            color: #a3c2e0;
        }

        .inline-keyboard {
            display: grid;
            grid-template-columns: repeat(2, 120px);
            gap: 6px;
            margin-top: 10px;
        }

        .inline-keyboard.reactions {
            grid-template-columns: repeat(2, 60px);
        }

        .tg-btn {
            background-color: var(--tg-button-bg);
            color: var(--tg-button-text);
            border: none;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 13.5px;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            transition: background 0.15s;
        }

        .tg-btn:hover {
            background-color: #263442;
        }

        .tournament-link {
            color: var(--tg-link);
            text-decoration: none;
            font-size: 13px;
            display: block;
            margin-top: 8px;
        }

        .chat-input-bar {
            background-color: var(--tg-msg-in);
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-top: 1px solid rgba(0, 0, 0, 0.2);
        }

        .menu-pill {
            background-color: #2481cc;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            background: transparent;
        }

        .input-field {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--tg-text);
            font-size: 14.5px;
            outline: none;
        }

        .input-field::placeholder {
            color: var(--tg-text-muted);
        }

        .clip-icon {
            color: var(--tg-text-muted);
            font-size: 20px;
            cursor: pointer;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <div class="avatar-header">чгк</div>
        <div class="bot-info">
            <h3>чгк</h3>
            <span id="botStatus">bot</span>
        </div>
    </div>

    <div class="chat-messages" id="chatContainer">
        <!-- Вопросы будут динамически выводиться друг за другом -->
    </div>

    <div class="chat-input-bar">
        <button class="menu-pill" onclick="loadNewQuestion()">🎲</button>
        <div class="clip-icon">📎</div>
        <div class="input-wrapper">
            <input type="text" id="userInput" class="input-field" placeholder="Write a message..." onkeydown="if(event.key === 'Enter') sendUserMessage()" disabled>
        </div>
    </div>
</div>

<script src="app.js"></script>

</body>
</html>
